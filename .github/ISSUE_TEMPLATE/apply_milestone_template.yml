name: Apply Milestone Template
description: Create a milestone and its predefined issues in this repository.
title: "[MILESTONE TEMPLATE] "
labels: ["automation"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to create a milestone and its predefined issues.
        The automation will create the items in this repository.

  - type: dropdown
    id: template
    attributes:
      label: Milestone template
      description: Select the predefined set of issues to create.
      options:
        - PACS Migration
        - Research Phase
    validations:
      required: true

  - type: input
    id: milestone_name
    attributes:
      label: New milestone name
      description: Enter the name for this instance of the milestone.
      placeholder: PACS Migration — 2027
    validations:
      required: true

  - type: input
    id: due_date
    attributes:
      label: Due date
      description: Optional. Use YYYY-MM-DD.
      placeholder: "2027-06-30"
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I confirm that I want to create this milestone and its issues.
          required: true
